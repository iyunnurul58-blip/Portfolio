 ['Discovering Product Thinking','The turning point came during a university product innovation course. Working with teammates from Philosophy and IT backgrounds, I explored a problem we experienced as international students: university club information was scattered across different communication platforms, making it difficult to discover activities and connect with communities. We researched the problem, engaged potential users, applied Jobs-to-Be-Done, designed an interactive prototype, and pitched our proposed solution. The project is called University Club Connect.'],
 ['From Understanding Problems to Building Solutions','That experience changed my perspective. I realized I was particularly interested in what happens before and beyond analysis: understanding people’s problems, deciding what to build, and shaping a solution that could improve their experience.'],
 ['Continuing the Journey','I continued exploring digital products through a short website development course and later joined the Business Analysis, Product Strategy, and Project Management bootcamp at Dibimbing.id. These experiences gave me more opportunities to practice research, product documentation, planning, prototyping, testing, and AI-assisted development.']
];return `${wrap(`<div class="page-head"><div class="eyebrow">About Me</div><h1>From Accounting Systems to Product Thinking.</h1><p>My journey into product and project management hasn't followed a straight line.</p></div><div class="narrow">${story.map((s,i)=>`<section class="story-block"><div class="eyebrow">Chapter ${String(i+1).padStart(2,'0')}</div><h2>${esc(s[0])}</h2><p>${esc(s[1])}</p></section>`).join('')}<section class="section"><div class="soft-panel"><h2>Where I'm Going</h2><p>Today, I bring together different perspectives: the business process understanding I gained from Accounting and Marketing, the analytical foundations of my Master's degree, and the product development experience I've built through projects and my Product Management internship.</p><p><strong>My goal is to continue growing in Product and Project Management, helping teams turn complex business and user problems into clear, actionable, and meaningful solutions.</strong></p></div></section></div>`)}`+`<section class="section alt">${wrap(`${sectionHead('Education & Training','My Education', 'Academic background and training that supported this journey.')}<div class="grid three"><div class="panel"><h3>Master of Business Analytics</h3><p>The University of Adelaide<br>Feb 2023 – May 2025</p><p class="small">LPDP Scholarship · GPA 3.17 / 4.0</p></div><div class="panel"><h3>Bachelor of Accounting</h3><p>Universitas Muhammadiyah Yogyakarta<br>Aug 2017 – Dec 2021</p><p class="small">National Central University exchange (2019) · GPA 3.77 / 4.0</p></div><div class="panel"><h3>Business Analysis, Product Strategy & Project Management</h3><p>Dibimbing.id<br>Apr – Oct 2026</p><p class="small">Product development, data visualization, product research, and AI optimization.</p></div></div>`)}</section>`;}
function projectsPage(){const values=['All','Product / PM','Data / BA','Personal'];let filtered=ui.filter==='All'?DISPLAY_PROJECTS:DISPLAY_PROJECTS.filter(p=>p.category===ui.filter);return `${wrap(`<div class="page-head"><div class="eyebrow">My Work</div><h1>Projects</h1><p>Academic, bootcamp, and personal projects where I apply business, analytical, and product problem-solving skills.</p></div><div class="filter-row">${values.map(v=>`<button type="button" data-filter="${esc(v)}" class="chip ${ui.filter===v?'active':''}" aria-pressed="${ui.filter===v}">${esc(v)}${v==='All'?` (${PROJECTS.length})`:''}</button>`).join('')}</div><div class="grid three" id="project-gallery">${filtered.map(projectCard).join('')}</div><div style="height:50px"></div>`)}`;}
function projectDetail(id){const p=getProject(id);if(!p)return wrap('<div class="page-head"><h1>Project not found</h1><a class="btn" href="#/projects">Back to Projects</a></div>');return `${wrap(`<div class="page-head" style="padding-bottom:0"><a class="link" href="#/projects">← All Projects</a></div><div class="detail-banner"><div class="eyebrow">${p.full?'Detailed Case Study':'Project Overview'} · ${esc(p.kind)}</div><h1>${esc(p.name)}</h1><h3>${esc(p.short)}</h3><p>${esc(p.summary)}</p><div class="tag-row">${p.tools.slice(0,5).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div><div class="detail-layout"><div>${p.sections.map(([name,body],i)=>`<section class="detail-block"><div class="eyebrow">${String(i+1).padStart(2,'0')}</div><h2>${esc(name)}</h2><p>${esc(body)}</p></section>`).join('')}<div class="btn-row" style="margin:32px 0 70px"><a class="btn outline" href="#/projects">← Browse More Projects</a></div></div><aside class="panel sticky-aside"><div class="eyebrow">Project Details</div><h3>${esc(p.role)}</h3><p class="small">${esc(p.when)}<br>${esc(p.kind)}</p><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Methods & Tools</h3>${tagList(p.tools)}${p.resources.length?`<hr style="border:0;border-top:1px solid var(--line);margin:19px 0"><h3>Working Project & Evidence</h3><div class="resource-list">${p.resources.map(([label,url])=>extLink(label,url)).join('')}</div>`:''}</aside></div>`)}`;}
function howIBuild(){const steps=BUILD_STEPS;return `${wrap(`<div class="page-head"><div class="eyebrow">How I Build</div><h1>From an Idea to a Working Prototype.</h1><p>My process combines problem-solving, structured requirements, AI-assisted building and iteration.</p><p>I often use AI as a brainstorming partner to challenge ideas and offer different perspectives. I then use detailed requirements, design tools, generated code, and hands-on revisions to build and test practical prototypes.</p></div><section class="section">${sectionHead('01 · My Working Process','How I Approach Building')}<div class="grid three">${steps.map(({title:h,description:d,tools:t},i)=>`<div class="panel process-card"><div class="step-no">0${i+1}</div><h3 style="margin-top:12px">${esc(h)}</h3><p>${esc(d)}</p><div class="tool-line">${esc(t)}</div></div>`).join('')}</div></section>`)}`+`<section class="section alt">${wrap(`${sectionHead('02 · Examples','How the Process Appears in My Projects')}<div class="grid two"><div class="panel"><div class="eyebrow">Sprity</div><h3>Frontend ⇄ Google Sheets</h3><p>Donation and shopping forms pass user-submitted information to Apps Script, while impact reporting retrieves data from the spreadsheet for presentation in the frontend. WhatsApp links handle further communication.</p><a class="link" href="#/project/sprity">See Sprity →</a></div><div class="panel"><div class="eyebrow">Reading Tracker</div><h3>Check In → Read → Check Out → Dashboard</h3><p>A reading session records a book, chapter and initial mood; after checking out, duration, completed chapter and mood changes appear in history and charts. The data layer is Google Sheets via Apps Script.</p><a class="link" href="#/project/reading-tracker">See Reading Tracker →</a></div></div>`)}</section>`+`<section class="section">${wrap(`${sectionHead('03 · Where Analysis Fits','From Data to Recommendations')}<div class="panel"><p>My coursework in Business Analytics introduced me to R, SAS, Python, Power BI, Tableau and Looker Studio. Through the Adidas dashboard and other analytical projects, I practiced preparing and interpreting data for business decisions. I distinguish tools explored academically from the lightweight stack I currently use for prototyping.</p><a class="link" href="#/projects">Browse Projects →</a></div>`)}</section>`;}
function roleList(items){return items.map(x=>`<article class="role"><div class="eyebrow">${esc(x.when)}</div><h3>${esc(x.title)}</h3><p class="small"><strong>${esc(x.org)}</strong></p><ul>${x.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></article>`).join('');}
function experience(){return `${wrap(`<div class="page-head"><div class="eyebrow">Experience</div><h1>Experiences That Shaped My Perspective.</h1><p>Across professional and organizational roles, I've worked with business processes, communication, documentation, coordination and hands-on delivery.</p></div><section class="section" style="padding-top:10px">${sectionHead('01 · Work','Professional Experience')}<div class="narrow">${roleList(WORK)}</div></section>`)}`+`<section class="section alt">${wrap(`${sectionHead('02 · Leadership & Community','Organization Experience')}<div class="narrow">${roleList(ORGANIZATIONS)}</div>`)}</section>`;}
function contact(){const links=[['Email',CONTACT.email,`mailto:${CONTACT.email}`],['WhatsApp','Chat directly',CONTACT.whatsapp],['LinkedIn','Professional profile',CONTACT.linkedin],['GitHub','Projects and deployed websites',CONTACT.github],['Download CV','Current resume (PDF)',CONTACT.cv]];return wrap(`<div class="page-head"><div class="eyebrow">Contact</div><h1>Let's Connect.</h1><p>I'm interested in opportunities in Product Management, Project Management, Business Analysis, and related roles.</p></div><div class="contact-grid" style="margin-bottom:80px">${links.map(([title,description,href])=>`<a class="contact-link" href="${esc(href)}" ${href.startsWith('mailto:')||href.endsWith('.pdf')?'':'target="_blank" rel="noopener noreferrer"'}><span><strong>${esc(title)}</strong><br><span class="muted small">${esc(description)}</span></span><span aria-hidden="true">↗</span></a>`).join('')}</div>`);}

function routeParts(){return (location.hash||'#/home').replace(/^#\//,'').split('/');}
function render(){const [page,id]=routeParts();if(page==='home')app.innerHTML=home();else if(page==='about')app.innerHTML=about();else if(page==='projects')app.innerHTML=projectsPage();else if(page==='project')app.innerHTML=projectDetail(id);else if(page==='how-i-build')app.innerHTML=howIBuild();else if(page==='experience')app.innerHTML=experience();else if(page==='contact')app.innerHTML=contact();else app.innerHTML=home();
 const active=page==='project'?'projects':page;document.querySelectorAll('[data-nav]').forEach(link=>{if(link.dataset.nav===active)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current');});
 document.title=(page==='project'?getProject(id)?.name:({home:'Home',about:'About Me',projects:'Projects','how-i-build':'How I Build',experience:'Experience',contact:'Contact'})[page]||'Portfolio')+' | Nurul Nadjmie';
 document.getElementById('navigation').classList.remove('open');document.getElementById('menu-toggle').setAttribute('aria-expanded','false');if(page==='home')renderHouse();window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
document.addEventListener('change',e=>{if(e.target?.id==='house-project-select'){ui.project=e.target.value;updateHouse();}});
document.addEventListener('click',e=>{
  const filter=e.target.closest('[data-filter]');
  if(filter){ui.filter=filter.dataset.filter;app.innerHTML=projectsPage();return;}
});
document.getElementById('menu-toggle').addEventListener('click',()=>{const nav=document.getElementById('navigation');const open=nav.classList.toggle('open');document.getElementById('menu-toggle').setAttribute('aria-expanded',String(open));});
if(!location.hash)location.hash='#/home';else render();
</script>
